inherit_from: .rubocop_todo.yml

# Exclude lists here add to the todo's instead of replacing them.
inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-minitest

AllCops:
  TargetRubyVersion: 4.0
  TargetRailsVersion: 8.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    # ERB templates that only look like Ruby.
    - 'lib/generators/**/templates/**/*'
    - 'test/dummy/db/schema.rb'
    - 'target/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 120

# The gem's own Rakefile has no Rails :environment task to depend on.
Rails/RakeEnvironment:
  Exclude:
    - 'Rakefile'

Metrics/BlockLength:
  Exclude:
    - '*.gemspec'
