plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-minitest

AllCops:
  TargetRubyVersion: 4.0
  TargetRailsVersion: 8.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    # ERB templates that only look like Ruby.
    - 'lib/generators/**/templates/**/*'
    - 'test/dummy/db/schema.rb'
    - 'target/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 120

# The gem's own Rakefile has no Rails :environment task to depend on.
Rails/RakeEnvironment:
  Exclude:
    - 'Rakefile'

Metrics/BlockLength:
  Exclude:
    - '*.gemspec'

# Tests assert one scenario end to end.
Minitest/MultipleAssertions:
  Max: 8

# Tests write daemon-owned rows the way the daemon does: insert!, update_all.
Rails/SkipsModelValidations:
  Exclude:
    - 'test/**/*'
    - 'lib/active_matrix/testing.rb'

# The defaults suit app code; a DSL class and its dispatch read better whole.
# Migrations are linear DDL scripts; method size says nothing about them.
Metrics/MethodLength:
  Max: 16
  Exclude:
    - 'db/migrate/*.rb'
Metrics/AbcSize:
  Max: 25
  Exclude:
    - 'db/migrate/*.rb'
Metrics/ClassLength:
  Max: 200
  Exclude:
    - 'test/**/*'
Metrics/CyclomaticComplexity:
  Max: 10
Metrics/PerceivedComplexity:
  Max: 10
# Keyword arguments name themselves; the DSL takes several.
Metrics/ParameterLists:
  CountKeywordArgs: false

# RuboCop's short names, plus the DSL's dm:.
Naming/MethodParameterName:
  AllowedNames: ['as', 'at', 'by', 'cc', 'db', 'dm', 'id', 'if', 'in', 'io', 'ip', 'of', 'on', 'os', 'pp', 'to']
