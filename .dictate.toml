# Dictator Configuration
# Structural enforcement; run `dictator lint .` (stalint) before committing.
# https://github.com/seuros/dictator

[decree.supreme]
# Universal structural rules (applies to ALL files unless a language decree overrides)
trailing_whitespace = "deny"
tabs_vs_spaces = "spaces"
tab_width = 2
final_newline = "require"
line_endings = "lf"
blank_line_whitespace = "deny"

# Makefiles require tabs; Markdown code blocks may legitimately contain them.
[decree.supreme.ignore.tab-character]
filenames = ["Makefile", "GNUmakefile", "makefile"]
extensions = ["md", "mdx"]

[decree.ruby]
max_line_length = 120
max_lines = 300
ignore_comments = true
ignore_blank_lines = true
# SQL lives in heredocs; only the Ruby around it is held to 120.
ignore_heredocs = true
method_visibility_order = ["public", "protected", "private"]
comment_spacing = true

# Generated by Rails on every migration.
[decree.ruby.ignore.line-too-long]
filenames = ["schema.rb"]

[decree.rust]
tab_width = 4
max_line_length = 100
max_lines = 400
ignore_comments = true
ignore_blank_lines = true
visibility_order = ["pub", "private"]

[decree.rust.linter]
command = "clippy"
