# Postgres 18 from docker-compose.yml (port 5440) unless DATABASE_URL is set.
# gssencmode: libpq's GSSAPI negotiation crashes forked processes on macOS,
# and padded_cell forks every test.
default: &default
  adapter: postgresql
  encoding: unicode
  url: <%= ENV.fetch('DATABASE_URL', 'postgresql://activematrix:activematrix@127.0.0.1:5440') %>
  gssencmode: disable
  pool: 10

development:
  <<: *default
  database: activematrix_development

test:
  <<: *default
  database: activematrix_test
