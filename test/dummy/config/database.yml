# Postgres 18 from docker-compose.yml (port 5440) unless DATABASE_URL is set.
# gssencmode: libpq's GSSAPI negotiation crashes forked processes on macOS,
# and padded_cell forks every test.
default: &default
  adapter: postgresql
  encoding: unicode
  url: <%= ENV.fetch('DATABASE_URL', 'postgresql://activematrix:activematrix@127.0.0.1:5440') %>
  gssencmode: disable
  pool: 10

development:
  <<: *default
  database: activematrix_development

# System tests use their own (ACTIVEMATRIX_TEST_DATABASE=activematrix_system), so
# rows they commit for the daemon never meet the unit suite.
test:
  <<: *default
  database: <%= ENV.fetch('ACTIVEMATRIX_TEST_DATABASE', 'activematrix_test') %>
