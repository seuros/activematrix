# Synapse for the contract tier: `docker compose --profile contract up -d`,
# then `bundle exec rake test:contract`.
#
# Throwaway by design: SQLite inside the container, no federation, and
# secrets that are public because they are here. Never reuse it.
server_name: contract.test
pid_file: /data/homeserver.pid
public_baseurl: http://127.0.0.1:8008/

listeners:
  - port: 8008
    bind_addresses: ['0.0.0.0']
    type: http
    tls: false
    resources:
      - names: [client]
        compress: false

database:
  name: sqlite3
  args:
    database: /data/homeserver.db

media_store_path: /data/media_store
# Generated by Synapse when missing.
signing_key_path: /data/signing.key
trusted_key_servers: []
suppress_key_server_warning: true
report_stats: false

# The tests register their accounts with this (rake test:contract passes it).
registration_shared_secret: contract-registration-secret
macaroon_secret_key: contract-macaroon-secret
form_secret: contract-form-secret
enable_registration: false

# Tests register, join and send far faster than people; Synapse's defaults
# would throttle them into timeouts.
rc_message: { per_second: 1000, burst_count: 1000 }
rc_registration: { per_second: 1000, burst_count: 1000 }
rc_login:
  address: { per_second: 1000, burst_count: 1000 }
  account: { per_second: 1000, burst_count: 1000 }
  failed_attempts: { per_second: 1000, burst_count: 1000 }
rc_joins:
  local: { per_second: 1000, burst_count: 1000 }
  remote: { per_second: 1000, burst_count: 1000 }
rc_invites:
  per_room: { per_second: 1000, burst_count: 1000 }
  per_user: { per_second: 1000, burst_count: 1000 }
  per_issuer: { per_second: 1000, burst_count: 1000 }
